# Cloudflare Pages + D1 绑定配置
# 此文件用于本地 wrangler CLI 管理（可选）；Pages 控制台部署以控制台绑定为准

name = "money-note"
compatibility_date = "2024-06-01"

# Pages 构建配置
pages_build_output_dir = "."

# D1 数据库绑定（对应 Functions 中的 env.DB）
# 首次部署前需用以下命令创建数据库并填入 database_id：
#   npx wrangler d1 create money-db
[[d1_databases]]
binding = "DB"
database_name = "money-db"
database_id = "replace-with-your-d1-database-id"
